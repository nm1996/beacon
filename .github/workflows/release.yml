name: Release

# Runs when the stage and prod workflows call it with the tag they created, or
# when a tag is pushed by hand. Tags created by a workflow do not trigger
# other workflows, which is why stage and prod call this one directly.
on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      tag:
        description: The tag to release, such as v0.2.0 or v0.2.0-rc.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build and publish ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      # Installs the Go and golangci-lint versions pinned in .mise.toml.
      - uses: jdx/mise-action@v5

      - name: Check
        run: mise run check

      - name: Build release archives
        env:
          VERSION: ${{ env.TAG }}
        run: mise run dist

      # Tags with a suffix, such as v0.1.0-rc.1, become pre-releases.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$TAG" == *-* ]]; then
            prerelease="--prerelease"
          fi

          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            $prerelease \
            dist/*.tar.gz dist/*.zip dist/checksums.txt

  image:
    name: Publish container image ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Tags v0.1.0 as 0.1.0 and 0.1, and moves latest only for releases
      # without a suffix, so v0.1.0-rc.1 never becomes latest. The version
      # is given explicitly, since a called run's ref is the stage or prod
      # branch rather than the tag.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=${{ !contains(env.TAG, '-') }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deployments/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.TAG }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
