name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the Go and golangci-lint versions pinned in .mise.toml.
      - uses: jdx/mise-action@v5

      - name: Check
        run: mise run check

      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: mise run dist

      # Tags with a suffix, such as v0.1.0-rc.1, become pre-releases.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease="--prerelease"
          fi

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease \
            dist/*.tar.gz dist/*.zip dist/checksums.txt
