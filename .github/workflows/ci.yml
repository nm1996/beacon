name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the Go and golangci-lint versions pinned in .mise.toml.
      - uses: jdx/mise-action@v5

      - name: Check formatting
        run: mise run fmt-check

      - name: Vet
        run: mise run vet

      - name: Lint
        run: mise run lint

      - name: Test with the race detector
        run: mise run test-race

      - name: Check for known vulnerabilities
        run: mise run vuln

      - name: Build
        run: mise run build

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployments/docker/Dockerfile
          build-args: VERSION=ci-${{ github.sha }}
          tags: beacon:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Starts the image the way users will and waits for Docker to report it
      # healthy, which exercises the built-in --health-check.
      - name: Start the image and wait until it is healthy
        run: |
          docker run -d --name beacon -p 8080:8080 beacon:ci
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' beacon)"
            echo "attempt ${attempt}: ${status}"
            if [ "$status" = healthy ]; then
              curl -fsS localhost:8080/health
              exit 0
            fi
            sleep 2
          done
          docker logs beacon
          exit 1
