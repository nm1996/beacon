[tools]
# Keep in step with GO_VERSION in deployments/docker/Dockerfile.
go = "1.27.4"
golangci-lint = "2.15.0"

[tasks.fmt]
description = "Format Go source files with gofmt"
run = "gofmt -w ."

[tasks.fmt-check]
description = "Fail if any Go file is not gofmt-formatted"
run = 'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.test-race]
description = "Run tests with the race detector"
run = "go test -race ./..."

[tasks.vuln]
description = "Scan dependencies and code for known vulnerabilities"
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./..."

[tasks.build]
description = "Build the beacon binary into bin/"
run = "go build -o bin/beacon ./cmd/beacon"

[tasks.dist]
description = "Build release archives for every platform into dist/ (VERSION defaults to git describe)"
run = "bash scripts/dist.sh"

[tasks.docker-build]
description = "Build the beacon:dev container image"
run = "docker build -f deployments/docker/Dockerfile --build-arg VERSION=$(git describe --tags --always --dirty) -t beacon:dev ."

[tasks.run]
description = "Run the Beacon server"
run = "go run ./cmd/beacon"

# check only reads the source, so CI and release builds test exactly what was
# committed. Run mise run fmt to fix formatting.
[tasks.check]
description = "Check formatting, vet, lint, and run race-enabled tests and govulncheck"
depends = ["fmt-check"]
run = [
  "go vet ./...",
  "golangci-lint run ./...",
  "go test -race ./...",
  "mise run vuln",
]
