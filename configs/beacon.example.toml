# Beacon example configuration
#
# Copy this file to a location of your choice and pass it to Beacon with:
#   beacon --config /path/to/beacon.toml
#
# Every key is optional; anything left out keeps the value shown here, which
# is also what Beacon uses when started without --config. Unknown keys are
# rejected. Durations use Go syntax such as "500ms", "5s" or "1m30s".
#
# Every key can also be set with an environment variable, which wins over
# this file: BEACON_ plus the section and key in upper case, for example
# BEACON_SERVER_PORT=9090 or BEACON_REGISTRY_SERVICE_TTL=2m.
#
# Keep this file synchronized with internal/config.
# Do not put passwords, tokens, or other secrets in this file.

[server]
# Interface the HTTP server listens on. "0.0.0.0" means all interfaces.
host = "0.0.0.0"

# TCP port for the HTTP API.
port = 8080

# Maximum time allowed to read an incoming request, headers included.
read_timeout = "5s"

# Maximum time allowed to write a response.
write_timeout = "10s"

# Maximum time to keep an idle HTTP connection open.
idle_timeout = "60s"

# Time in-flight requests get to finish when Beacon shuts down.
shutdown_timeout = "10s"

# Largest request body the API accepts, in bytes. Larger bodies get 400.
max_request_body_bytes = 65536

[registry]
# A service instance is considered stale after this period without a heartbeat.
service_ttl = "30s"

# How often Beacon checks for stale service instances.
cleanup_interval = "5s"

[logging]
# Minimum level logged: "debug", "info", "warn" or "error".
level = "info"

# "json" for machines and log collectors, "text" for reading in a terminal.
format = "json"
