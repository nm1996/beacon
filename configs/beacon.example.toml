# Beacon example configuration
#
# Copy this file to a location of your choice and pass it to Beacon with:
#   beacon --config /path/to/beacon.toml
#
# Every key is optional; anything left out keeps the value shown here, which
# is also what Beacon uses when started without --config. Unknown keys are
# rejected. Durations use Go syntax such as "500ms", "5s" or "1m30s".
#
# Every key can also be set with an environment variable, which wins over
# this file: BEACON_ plus the section and key in upper case, for example
# BEACON_SERVER_PORT=9090 or BEACON_REGISTRY_SERVICE_TTL=2m.
#
# Keep this file synchronized with internal/config.
# Do not put passwords, tokens, or other secrets in this file.

[server]
# Interface the HTTP server listens on. The default only accepts connections
# from this machine. Use "0.0.0.0" to accept them from the network, and turn
# on TLS and authentication before you do: without them anyone who can reach
# the port can register and remove instances. The container image sets
# BEACON_SERVER_HOST=0.0.0.0, since it is only reachable through its
# published ports.
host = "127.0.0.1"

# TCP port for the HTTP API.
port = 8080

# Maximum time allowed to read an incoming request, headers included.
read_timeout = "5s"

# Maximum time allowed to write a response.
write_timeout = "10s"

# Maximum time to keep an idle HTTP connection open.
idle_timeout = "60s"

# Time in-flight requests get to finish when Beacon shuts down.
shutdown_timeout = "10s"

# Largest request body the API accepts, in bytes. Larger bodies get 400.
max_request_body_bytes = 65536

# How often to check the TLS files and the tokens file for changes, and
# reload them when their contents differ, without a restart. "0s" turns
# checking off. Sending Beacon SIGHUP reloads them at once on Linux and macOS.
# A reload that fails keeps the files Beacon already has.
reload_interval = "0s"

[tls]
# Serve HTTPS instead of plain HTTP. Set both files to turn TLS on, or leave
# both empty for plain HTTP. cert_file is a PEM certificate chain, leaf first;
# key_file is the PEM private key for that leaf. Both are read at startup, and
# Beacon refuses to start if they are missing or do not match. TLS 1.2 is the
# minimum version accepted.
cert_file = ""
key_file = ""

# PEM bundle of the CAs whose client certificates (mTLS) Beacon accepts.
# Leave empty to accept bearer tokens only. Needs cert_file, key_file and
# auth.enabled. Clients without a certificate can still connect and send a
# token; [[certificates]] entries in auth.tokens_file decide what each
# certificate may do. See "Client certificates (mTLS)" in the README.
client_ca_file = ""

[auth]
# Require a bearer token on every endpoint except /health. Clients send it as
# "Authorization: Bearer <token>". Turn on TLS as well, or tokens cross the
# network in plain text.
enabled = false

# File listing the accepted tokens by their SHA-256 hash, and what each token
# may do. Required when enabled is true. See "Authentication" in the README
# for its format and for "beacon --hash-token", which computes the hashes.
tokens_file = ""

[registry]
# A service instance is considered stale after this period without a heartbeat.
service_ttl = "30s"

# How often Beacon checks for stale service instances.
cleanup_interval = "5s"

# The longest service name and the longest host name a registration may use,
# each between 1 and 253. The name default fits a DNS label; the address
# default is the longest DNS name. IP addresses are not held to the limit.
max_name_length = 63
max_address_length = 253

# The most instances Beacon holds at once. Further registrations get 429
# quota_exceeded until instances unregister or expire. This bounds memory use
# and the size of discovery responses.
max_instances = 10000

# The most instances one token or certificate may hold at once, so a single
# caller cannot take every place above. 0 means no limit per owner. It only
# applies with authentication on, since callers are not told apart without it.
max_instances_per_owner = 0

[rate_limit]
# Each limit is a token bucket: a steady rate per second, and a burst that
# may be spent at once. A rate of 0 turns that limit off.
#
# Registrations each caller may make: per token or certificate with
# authentication on, per client network without it. Beyond it they get 429
# rate_limited.
registrations_per_second = 20
registration_burst = 200

# Failed authentication attempts (unknown or malformed credentials) each
# client network may make. Beyond it, every request from that network gets
# 429 rate_limited until it is back under the limit. Behind a proxy all
# clients share its address; raise or turn off these limits there.
auth_failures_per_second = 1
auth_failure_burst = 20

[storage]
# Where registered instances are kept. Only "memory" exists today: fast, and
# everything is forgotten on restart, so clients register again.
backend = "memory"

[metrics]
# Serve Prometheus metrics at GET /metrics on the API port.
enabled = true

[logging]
# Minimum level logged: "debug", "info", "warn" or "error".
level = "info"

# "json" for machines and log collectors, "text" for reading in a terminal.
format = "json"
